<!-- @dsCard group="Colors" viewport="700x180" name="Product ranges" subtitle="Mint, Peach, Sky, Sun, Lavender — sparing use: tabs, indicators, small highlights" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-body);display:flex;height:180px}
.col{flex:1;display:flex;flex-direction:column}
.sw{flex:2;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;font-size:11px;color:var(--midnight)}
.tint{flex:1}
</style></head><body>
<div class="col"><div class="sw" style="background:var(--mint)"><strong>Mint</strong><span>#c3ffd0</span></div><div class="tint" style="background:var(--mint-50)"></div></div>
<div class="col"><div class="sw" style="background:var(--peach)"><strong>Peach</strong><span>#ef9a98</span></div><div class="tint" style="background:var(--peach-50)"></div></div>
<div class="col"><div class="sw" style="background:var(--sky)"><strong>Sky</strong><span>#b3e7fb</span></div><div class="tint" style="background:var(--sky-50)"></div></div>
<div class="col"><div class="sw" style="background:var(--sun)"><strong>Sun</strong><span>#f9dcbf</span></div><div class="tint" style="background:var(--sun-50)"></div></div>
<div class="col"><div class="sw" style="background:var(--lavender)"><strong>Lavender</strong><span>#ba91d8</span></div><div class="tint" style="background:var(--lavender-50)"></div></div>
</body></html>
